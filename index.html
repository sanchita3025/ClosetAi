<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClosetAI - Login & Setup</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-logo"><i class="fa-solid fa-wand-magic-sparkles"></i> ClosetAI</div>
    <div class="splash-tagline">Style Smarter. Wear Better.</div>
  </div>

  <!-- Login Section -->
  <div id="login-section" class="onboarding-container" style="display: none;">
    <div class="glass-card">
      <h2>Welcome Back</h2>
      <p>Login to your smart wardrobe.</p>

      <form id="login-form">
        <div class="input-group">
          <label for="login-name">Full Name</label>
          <input type="text" id="login-name" placeholder="Enter your name" required>
        </div>

        <div class="input-group">
          <label for="login-phone">Phone Number</label>
          <input type="tel" id="login-phone" placeholder="Enter 10-digit number" pattern="[0-9]{10}" required>
        </div>

        <button type="button" id="send-otp-btn" class="btn-primary">Send OTP</button>

        <div id="otp-container" style="display: none; margin-top: 1rem;">
          <div class="input-group">
            <label for="login-otp">Enter OTP (Simulated: enter 1234)</label>
            <input type="text" id="login-otp" placeholder="1234">
          </div>
          <button type="submit" id="verify-otp-btn" class="btn-primary">Verify & Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Profile Setup Section (First Time Only) -->
  <div id="setup-section" class="onboarding-container" style="display: none;">
    <div class="glass-card">
      <h2>Profile Setup</h2>
      <p>Let's personalize your styling experience.</p>

      <form id="setup-form">
        <div class="input-group">
          <label for="setup-gender">Gender</label>
          <select id="setup-gender" required>
            <option value="" disabled selected>Select an option</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
          </select>
        </div>

        <div class="input-group">
          <label for="setup-bodyType">Body Type</label>
          <select id="setup-bodyType" required>
            <option value="" disabled selected>Select Gender First</option>
          </select>
          <p id="bodyType-hint" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px;"></p>
        </div>

        <div style="display: flex; gap: 1rem;">
          <div class="input-group" style="flex: 1;">
            <label for="setup-height">Height (cm)</label>
            <input type="number" id="setup-height" placeholder="165" min="120" max="220" required>
          </div>

          <div class="input-group" style="flex: 1;">
            <label for="setup-age">Age</label>
            <input type="number" id="setup-age" placeholder="25" min="10" max="100" required>
          </div>
        </div>

        <button type="submit" class="btn-primary">Complete Setup</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
